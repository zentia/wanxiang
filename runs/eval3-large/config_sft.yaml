# SFT stage for the 100M capacity run. MUST share config_hash with config_m2
# (same name/model/data/recover/eval; only train.max_steps differs, which is
# excluded from the hash). Uses the answer-side label file from eval3-clean.
experiment: wanxiang-eval3-large-m2
seed: 42

data:
  mix: m2_char_corpus
  seq_len: 128
  val_fraction: 0.02

model:
  layers: 14
  dim: 768
  heads: 12
  vocab_size: 8192

train:
  global_batch_tokens: 32768
  lr_peak: 1.5e-3
  warmup_steps: 40
  max_steps: 1600
  precision: fp32
  ckpt_every_steps: 50
  val_every_steps: 50
  grad_clip: 1.0

recover:
  max_retries: 3
  loss_spike_sigma: 3.0
  spike_window: 50
  early_stop_patience: 12

eval:
  harness_tasks: []
  milestones: [0.5, 1.0]
