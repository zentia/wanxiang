# More disjoint data + longer training (third extension block). Same model
# architecture as lm-baseline / lm-scaled / lm-scaled2; train stream is
# base + wiki_zh_ext + wiki_zh_ext2 + wiki_zh_ext3 (rows 0..2799 minus the
# frozen holdout docs). max_steps is a budget knob excluded from config_hash.
# Eval still points at runs/corpus/lm and is byte-frozen: the only variable
# vs the step2400 best is more disjoint documents + more steps.
data:
  mix: wiki_zh_corpus_lm_scaled3
  seq_len: 128
  val_fraction: 0.02
eval:
  harness_tasks: []
  milestones:
  - 0.5
  - 1.0
experiment: wanxiang-lm-baseline
model:
  dim: 256
  heads: 4
  layers: 4
  vocab_size: 8192
recover:
  early_stop_patience: 12
  loss_spike_sigma: 10.0
  max_retries: 3
  spike_window: 50
seed: 42
train:
  ckpt_every_steps: 100
  global_batch_tokens: 32768
  grad_clip: 1.0
  lr_peak: 0.001
  max_steps: 4800
  precision: fp32
  val_every_steps: 50
  warmup_steps: 30
